# XcodeGen の設定。Actions の Mac でこのファイルから Xcode のプロジェクトを作る。
# （Xcode のプロジェクトファイル自体はリポジトリに置かない）
name: DevKit
options:
  bundleIdPrefix: io.github.iwataka793
  deploymentTarget:
    iOS: "17.0"
packages:
  DevKitCore:
    path: ../Core
targets:
  DevKit:
    type: application
    platform: iOS
    sources:
      - Sources
    dependencies:
      - package: DevKitCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.iwataka793.devkit
        PRODUCT_NAME: DevKit
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: DevKit
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
  DevKitUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: DevKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.iwataka793.devkit.uitests
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: DevKit
schemes:
  DevKit:
    build:
      targets:
        DevKit: all
    test:
      targets:
        - DevKitUITests
