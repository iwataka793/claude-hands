# wda-refresh.exe（WebDriverAgent を署名して iPhone に入れ直す道具）を Windows 用に作る。
# 中身は tools/wda-refresh/main.rs。署名の部品は nab138/isideload（MIT、iloader と同じもの）。
# isideload の作者のロックファイルをそのまま使うため、isideload の例（examples/minimal）を差し替えてビルドする。
# Releases には tools-N として置く（最新版にはしない）。
name: wda-refresh build

on:
  push:
    branches: [main]
    paths:
      - "tools/wda-refresh/**"
      - ".github/workflows/wda-refresh.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: isideload を取ってくる（0.5.2 のコミットに固定）
        shell: bash
        run: |
          git clone https://github.com/nab138/isideload.git isl
          cd isl
          git checkout 326e562
          grep '^version' isideload/Cargo.toml

      - name: 例を wda-refresh に差し替える
        shell: bash
        run: |
          cp tools/wda-refresh/main.rs isl/examples/minimal/src/main.rs
          cd isl/examples/minimal
          # iloader と同じ keyring（Windows の資格情報マネージャー）
          printf '\n%s\n' 'keyring = { version = "3.6.3", features = ["windows-native"] }' >> Cargo.toml
          cat Cargo.toml

      - name: ビルド
        shell: bash
        run: |
          rustc --version
          cd isl
          cargo build --release -p minimal 2>&1 | tail -n 60
          ls -la target/release/minimal.exe
          cp target/release/minimal.exe ../wda-refresh.exe

      - name: Releases に置く（main のみ・最新版にはしない）
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="tools-${{ github.run_number }}"
          gh release create "$TAG" wda-refresh.exe \
            --title "wda-refresh $TAG" \
            --notes "WebDriverAgent を署名して入れ直す道具（Windows）。iloader の保存済みサインインを使う。" \
            --latest=false
