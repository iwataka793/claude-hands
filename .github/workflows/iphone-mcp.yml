# iPhone を見て・動かす MCP サーバー（Windows の exe）をビルドして、Claude デスクトップの拡張機能（.mcpb）にまとめる。
# Releases には mcp-N として置く（DevKit の最新版は変えない）。
name: iphone-mcp build

on:
  push:
    branches: [main]
    paths:
      - "tools/iphone-mcp/**"
      - ".github/workflows/iphone-mcp.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: iphone-mcp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/iphone-mcp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          check-latest: true
          cache: false

      - name: 依存を揃える
        run: |
          go mod tidy
          git diff --stat go.mod || true

      - name: 確かめる（vet）
        run: GOOS=windows GOARCH=amd64 go vet ./...

      - name: 起動の試験（Linux 版で MCP の受け答えを確かめる。iPhone は無し）
        run: |
          go build -o /tmp/iphone-mcp-linux .
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"iphone_status","arguments":{}}}' \
            '{"jsonrpc":"2.0","id":4,"method":"tools/call","params":{"name":"iphone_screenshot","arguments":{}}}' \
            > /tmp/in.jsonl
          (cat /tmp/in.jsonl; sleep 3) | IPHONE_MCP_STATE_DIR=/tmp/mcpstate timeout 20 /tmp/iphone-mcp-linux > /tmp/out.jsonl || true
          cat /tmp/out.jsonl | cut -c1-600
          python3 - <<'PY'
          import json
          rs = {}
          for l in open("/tmp/out.jsonl"):
              l = l.strip()
              if l:
                  m = json.loads(l)
                  if "id" in m: rs[m["id"]] = m
          tools = [t["name"] for t in rs[2]["result"]["tools"]]
          print("道具:", tools)
          assert len(tools) == 10, tools
          st = rs[3]["result"]["content"][0]["text"]
          print(st)
          assert "オフ" in st
          sc = rs[4]["result"]
          assert sc.get("isError") and "オフ" in sc["content"][0]["text"], sc
          print("スイッチがオフのとき画面は撮れない：OK")
          PY

      - name: Windows 用にビルド
        run: |
          mkdir -p pkg/server
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w -X main.version=0.1.${{ github.run_number }}+${GITHUB_SHA::7}" \
            -o pkg/server/iphone-mcp.exe .
          ls -la pkg/server

      - name: 拡張機能（.mcpb）にまとめる
        run: |
          python3 - <<'PY'
          import json
          m = json.load(open("manifest.json", encoding="utf-8"))
          m["version"] = "0.1.${{ github.run_number }}"
          json.dump(m, open("pkg/manifest.json", "w", encoding="utf-8"), ensure_ascii=False, indent=2)
          PY
          npx -y @anthropic-ai/mcpb validate pkg/manifest.json
          npx -y @anthropic-ai/mcpb pack pkg iphone-dev-kit.mcpb
          (cd switch && zip -q ../iphone-switch.zip *.bat)
          ls -la iphone-dev-kit.mcpb iphone-switch.zip

      - name: 結果を保存
        uses: actions/upload-artifact@v4
        with:
          name: iphone-mcp
          path: |
            tools/iphone-mcp/iphone-dev-kit.mcpb
            tools/iphone-mcp/iphone-switch.zip
            tools/iphone-mcp/go.sum
            tools/iphone-mcp/go.mod

      - name: Releases に置く（main のみ・最新版にはしない）
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="mcp-${{ github.run_number }}"
          gh release create "$TAG" iphone-dev-kit.mcpb iphone-switch.zip \
            --title "iPhone MCP $TAG" \
            --notes "Claude デスクトップの拡張機能（設定 → 拡張機能 → 詳細設定 → Install Extension… で iphone-dev-kit.mcpb を選ぶ）。iphone-switch.zip はカオル用のスイッチ（オフ・見るだけ・操作も可）。commit ${GITHUB_SHA::7}" \
            --latest=false
