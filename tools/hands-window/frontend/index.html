<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>claude-hands LIVE</title>
<style>
  :root { --bg:#0E0E12; --line:#2A2A33; --text:#ECECF1; --sub:#9A9AA8; --go:#3DD68C; --ng:#F2555A; --stop:#F2555A; }
  html, body { margin:0; height:100%; background:transparent; overflow:hidden; user-select:none;
    font-family:"Segoe UI Variable","Segoe UI","Yu Gothic UI","Meiryo",sans-serif; color:var(--text); }
  #card { position:absolute; inset:0; background:var(--bg); border:1px solid var(--line); border-radius:16px;
    display:flex; align-items:center; gap:10px; padding:0 10px 0 12px; box-sizing:border-box; }
  .ico { width:28px; height:28px; border-radius:9px; background:#1B1B22; display:flex; align-items:center; justify-content:center; flex:none; align-self:flex-start; margin-top:12px; }
  body.compact .ico { background:transparent; width:12px; align-self:center; margin-top:0; }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--go); flex:none; box-shadow:0 0 0 0 rgba(61,214,140,.6); animation:pulse 1.6s infinite; }
  .dot.ng { background:var(--ng); box-shadow:none; animation:none; }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(61,214,140,.55)} 70%{box-shadow:0 0 0 8px rgba(61,214,140,0)} 100%{box-shadow:0 0 0 0 rgba(61,214,140,0)} }
  .body { flex:1; min-width:0; }
  .head { display:flex; align-items:center; gap:4px; height:28px; }
  .live { font-weight:700; font-size:15px; letter-spacing:.06em; color:var(--go); margin-right:auto; }
  .chips { display:flex; gap:4px; flex:none; }
  .chip { height:18px; padding:0 7px; border-radius:6px; font-size:10px; font-weight:700; letter-spacing:.03em; display:flex; align-items:center; box-sizing:border-box; white-space:nowrap; }
  .chip.view { background:rgba(199,199,209,.10); border:1px solid rgba(199,199,209,.35); color:#C7C7D1; }
  .chip.operate { background:rgba(61,214,140,.12); border:1px solid rgba(61,214,140,.45); color:var(--go); }
  .jp { font-size:11px; color:var(--sub); }
  .title { font-size:12px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:0; }
  .last { font-size:11px; color:var(--sub); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px; }
  button { flex:none; border:1px solid var(--stop); background:transparent; color:var(--stop); border-radius:9px;
    font:600 11px/1 inherit; padding:7px 9px; cursor:pointer; letter-spacing:.06em; }
  button span { display:block; font-size:9px; font-weight:400; margin-top:3px; letter-spacing:0; }
  button:hover { background:rgba(242,85,90,.12); }
  /* たたんだ形 */
  body.compact #card { border-radius:20px; padding:0 12px; justify-content:center; gap:8px; }
  body.compact .body .title, body.compact .body .last, body.compact .chips, body.compact .jp, body.compact button { display:none; }
  #stop { width:60px; height:44px; border-radius:11px; background:rgba(242,85,90,.08); font-size:13px; font-weight:800; padding:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  #stop span { font-size:10px; margin-top:2px; }
  body.compact .live { margin-right:0; }
  body.compact #stop { display:none; } /* たたんだときは STOP を出さない（#stop の display:flex が上の決まりより強いため） */
  .msg { font-size:12px; color:var(--text); }
  /* DONE */
  #done { position:absolute; inset:0; background:var(--bg); border:1px solid var(--line); border-radius:14px; box-sizing:border-box;
    padding:12px 14px; display:none; flex-direction:column; gap:6px; --undo:#A78BFA; }
  body.done #card { display:none; } body.done #done { display:flex; }
  .dhead { display:flex; align-items:baseline; gap:8px; }
  .dlabel { font-weight:700; font-size:13px; letter-spacing:.14em; color:#60A5FA; }
  .dtitle { font-size:12px; font-weight:600; line-height:1.5; overflow-wrap:anywhere; display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:4; overflow:hidden; } /* 題名は折り返して全部出す（4 行まで） */
  .dsum { font-size:11px; color:var(--sub); line-height:1.5; }
  .dreport { display:none; flex:1; overflow:auto; font-size:11px; color:var(--text); white-space:pre-wrap; line-height:1.5;
    border-top:1px solid var(--line); padding-top:6px; }
  body.open .dreport { display:block; }
  .dhead, .dtitle, .dsum, .dmsg, .dbtns { flex-shrink:0; }
  .dreport { min-height:0; }
  .dbtns { display:flex; gap:6px; margin-top:auto; }
  .dbtns button { border-color:var(--line); color:var(--text); padding:6px 9px; }
  .dbtns button span { display:inline; margin:0 0 0 5px; font-size:10px; }
  .dbtns button.undo { border-color:var(--undo); color:var(--undo); }
  .dbtns button.undo.armed { background:rgba(167,139,250,.18); }
  .dmsg { font-size:11px; color:var(--undo); white-space:pre-wrap; }
  /* CHECK（容量の点検の知らせ） */
  #check { position:absolute; inset:0; background:var(--bg); border:1px solid var(--line); border-radius:14px; box-sizing:border-box;
    padding:12px 14px; display:none; flex-direction:column; gap:6px; }
  body.check #card, body.check #done { display:none; } body.check #check { display:flex; }
  .clabel { font-weight:700; font-size:13px; letter-spacing:.14em; color:#FBBF24; }
  .cnotes { margin:0; padding-left:16px; font-size:12px; line-height:1.5; overflow-wrap:anywhere; }
  .cnotes li { margin:2px 0; }
  .cfoot { font-size:10px; color:var(--sub); }
  .cbtns { display:flex; gap:6px; margin-top:auto; flex-shrink:0; }
  .cbtns button { border-color:var(--line); color:var(--text); padding:6px 9px; }
  .cbtns button span { display:inline; margin:0 0 0 5px; font-size:10px; }
  /* TRY（箱で試した結果。カオルが決める） */
  #try { position:absolute; inset:0; background:var(--bg); border:1px solid var(--line); border-radius:14px; box-sizing:border-box;
    padding:12px 14px; display:none; flex-direction:column; gap:5px; --try:#2DD4BF; }
  body.try #card, body.try #done, body.try #check { display:none; } body.try #try { display:flex; }
  .tlabel { font-weight:700; font-size:13px; letter-spacing:.14em; color:var(--try); }
  .tfile { font-size:13px; font-weight:700; overflow-wrap:anywhere; }
  .tline { font-size:11px; color:var(--sub); line-height:1.5; }
  .tcounts { font-size:12px; line-height:1.5; }
  .tlist { margin:0; padding-left:16px; font-size:11px; line-height:1.5; overflow-wrap:anywhere; }
  .tnotes { font-size:10px; color:var(--sub); line-height:1.5; white-space:pre-wrap; }
  .tmsg { font-size:11px; color:var(--try); white-space:pre-wrap; overflow-wrap:anywhere; }
  .tbtns { display:flex; gap:6px; margin-top:auto; flex-shrink:0; flex-wrap:wrap; }
  .tbtns button { border-color:var(--line); color:var(--text); padding:6px 9px; }
  .tbtns button span { display:inline; margin:0 0 0 5px; font-size:10px; }
  .tbtns button.apply { border-color:var(--try); color:var(--try); }
  .tbtns button.armed { background:rgba(45,212,191,.18); }
  .tbtns button.discard.armed { background:rgba(242,85,90,.15); border-color:var(--stop); color:var(--stop); }
</style>
</head>
<body class="compact">
<div id="card">
  <span class="ico"><span class="dot" id="dot"></span></span>
  <div class="body">
    <div class="head"><span class="live">LIVE</span><span class="chips" id="chips"></span></div>
    <div class="title" id="title"></div>
    <div class="last" id="last"></div>
  </div>
  <button id="stop" title="iPhone・PC・ブラウザのスイッチを全部オフにします">STOP<span>止める</span></button>
</div>
<div id="done">
  <div class="dhead"><span class="dlabel">DONE</span><span class="jp" id="dtime"></span></div>
  <div class="dtitle" id="dtitle"></div>
  <div class="dsum" id="dsum"></div>
  <div class="dreport" id="dreport"></div>
  <div class="dmsg" id="dmsg"></div>
  <div class="dbtns">
    <button id="dopen">DETAIL<span>詳しく</span></button>
    <button class="undo" id="dundo" title="この作業で Claude が変えた文字のファイルと、消したもの（取り置き）だけを戻します">UNDO<span>まとめて戻す</span></button>
    <button id="dclose">CLOSE<span>閉じる</span></button>
  </div>
</div>
<div id="check">
  <div class="dhead"><span class="clabel">CHECK</span><span class="jp" id="ctime"></span></div>
  <ul class="cnotes" id="cnotes"></ul>
  <div class="cfoot">Claude に「CHECK を見て」と言えば、続きを調べます</div>
  <div class="cbtns"><button id="cclose" title="今日はもう出しません。知らせが続いていれば明日また出ます">CLOSE<span>閉じる</span></button></div>
</div>
<div id="try">
  <div class="dhead"><span class="tlabel">TRY</span><span class="jp">箱で試しました（ネットなし）</span></div>
  <div class="tfile" id="tfile"></div>
  <div class="tline" id="tdef"></div>
  <div class="tcounts" id="tcounts"></div>
  <ul class="tlist" id="tlist"></ul>
  <div class="tnotes" id="tnotes"></div>
  <div class="tmsg" id="tmsg"></div>
  <div class="tbtns" id="tbtns">
    <button id="topen" title="ネットを切った箱の中で開いて、使ってみます">OPEN<span>箱の中で開く</span></button>
    <button class="apply" id="tapply" title="箱の中で増えた・変わったファイルを本物に入れます（元は取り置きへ）">APPLY<span>本物に入れる</span></button>
    <button class="discard" id="tdiscard" title="箱を空にします（本物は何も変わりません）">DISCARD<span>捨てる</span></button>
  </div>
  <div class="tbtns" id="tdone" style="display:none"><button id="tclose">CLOSE<span>閉じる</span></button></div>
</div>
<script>
  const $ = id => document.getElementById(id);
  let open = false;
  function drawDone(s) {
    document.body.classList.add('done'); document.body.classList.remove('compact');
    open = !!s.open; document.body.classList.toggle('open', open);
    $('dtime').textContent = '作業が終わりました' + (s.doneTime ? '（' + s.doneTime + '）' : '');
    $('dtitle').textContent = s.doneTitle || '';
    $('dtitle').title = s.doneTitle || '';
    $('dsum').textContent = (s.summary || []).join('\n');
    $('dsum').style.whiteSpace = 'pre-wrap';
    $('dreport').textContent = s.report || '';
    $('dopen').firstChild.textContent = open ? 'LESS' : 'DETAIL';
    $('dopen').querySelector('span').textContent = open ? 'たたむ' : '詳しく';
    $('dundo').classList.toggle('armed', !!s.undoArmed);
    $('dundo').querySelector('span').textContent = s.undoArmed ? 'もう一度押すと戻す' : 'まとめて戻す';
    $('dmsg').textContent = s.undoMsg || '';
    fitDone();
  }
  // DONE の窓（たたんだ形）の高さを中身に合わせる（題名が何行になっても切れない・すき間も出ない）
  let lastFit = 0;
  function fitDone() {
    if (open || !bound()) return;
    const d = $('done');
    const keep = d.style.bottom;
    d.style.bottom = 'auto';
    d.style.height = 'auto';
    const h = Math.ceil(d.getBoundingClientRect().height);
    d.style.height = '';
    d.style.bottom = keep;
    if (h > 0 && h !== lastFit) { lastFit = h; window.go.main.App.FitDone(h); }
  }
  let lastCheckFit = 0;
  function drawCheck(s) {
    document.body.classList.add('check'); document.body.classList.remove('compact', 'done', 'open');
    $('ctime').textContent = '容量の点検の知らせ' + (s.checkTime ? '（' + s.checkTime + '）' : '');
    const ul = $('cnotes'); ul.innerHTML = '';
    (s.check || []).forEach(n => { const li = document.createElement('li'); li.textContent = n; ul.appendChild(li); });
    if (!bound()) return;
    const d = $('check'); const keep = d.style.bottom;
    d.style.bottom = 'auto'; d.style.height = 'auto';
    const h = Math.ceil(d.getBoundingClientRect().height);
    d.style.height = ''; d.style.bottom = keep;
    if (h > 0 && h !== lastCheckFit) { lastCheckFit = h; window.go.main.App.FitCheck(h); }
  }
  let lastTryFit = 0;
  function drawTry(s) {
    const t = s.try || {};
    document.body.classList.add('try'); document.body.classList.remove('compact', 'done', 'open', 'check');
    $('tfile').textContent = t.file || '';
    $('tdef').textContent = t.done ? '' : (t.defender || '');
    $('tcounts').textContent = t.done ? '' : (t.counts || '');
    const ul = $('tlist'); ul.innerHTML = '';
    if (!t.done) (t.lines || []).forEach(n => { const li = document.createElement('li'); li.textContent = n; ul.appendChild(li); });
    $('tnotes').textContent = t.done ? '' : (t.notes || []).join('\n');
    $('tmsg').textContent = t.msg || '';
    $('tbtns').style.display = t.done ? 'none' : 'flex';
    $('tdone').style.display = t.done ? 'flex' : 'none';
    $('tapply').classList.toggle('armed', t.armed === 'apply');
    $('tdiscard').classList.toggle('armed', t.armed === 'discard');
    $('tapply').querySelector('span').textContent = t.armed === 'apply' ? 'もう一度押すと入れる' : '本物に入れる';
    $('tdiscard').querySelector('span').textContent = t.armed === 'discard' ? 'もう一度押すと捨てる' : '捨てる';
    if (!bound()) return;
    const d = $('try'); const keep = d.style.bottom;
    d.style.bottom = 'auto'; d.style.height = 'auto';
    const h = Math.ceil(d.getBoundingClientRect().height);
    d.style.height = ''; d.style.bottom = keep;
    if (h > 0 && h !== lastTryFit) { lastTryFit = h; window.go.main.App.FitTry(h); }
  }
  function draw(s) {
    if (!s) return;
    if (s.mode === 'try') { drawTry(s); return; }
    document.body.classList.remove('try');
    if (s.mode === 'check') { drawCheck(s); return; }
    document.body.classList.remove('check');
    if (s.mode === 'done') { drawDone(s); return; }
    document.body.classList.remove('done', 'open');
    document.body.classList.toggle('compact', !!s.compact);
    $('dot').classList.toggle('ng', !!s.ng || !!s.stopped);
    if (s.stopped) {
      $('chips').innerHTML = ''; $('title').textContent = '止めました：全部のスイッチをオフにしました'; $('last').textContent = '';
      return;
    }
    const L = { view:'VIEW', operate:'OPERATE' };
    $('chips').innerHTML = (s.chips || []).map(c => '<span class="chip ' + c.mode + '" title="' + c.name + '：' + (L[c.mode] || c.mode) + '">' + c.name + '</span>').join('');
    $('title').textContent = s.title || '';
    $('last').textContent = (s.last ? s.last : '') + (s.ago ? ' · ' + s.ago : '');
  }
  function bound() { return window.go && window.go.main && window.go.main.App; }
  document.addEventListener('mouseenter', () => bound() && window.go.main.App.Hover(true));
  document.addEventListener('mouseleave', () => bound() && window.go.main.App.Hover(false));
  $('stop').addEventListener('click', async () => {
    if (!bound()) return;
    const r = await window.go.main.App.Stop();
    $('title').textContent = r;
  });
  $('cclose').addEventListener('click', () => bound() && window.go.main.App.CloseCheck());
  $('dopen').addEventListener('click', () => bound() && window.go.main.App.OpenDone(!open));
  $('dclose').addEventListener('click', () => bound() && window.go.main.App.CloseDone());
  $('dundo').addEventListener('click', async () => { if (bound()) { $('dmsg').textContent = '…'; const r = await window.go.main.App.Undo(); $('dmsg').textContent = r; } });
  const tryCall = async (fn) => { if (bound()) { $('tmsg').textContent = '…'; const r = await window.go.main.App[fn](); if (r) $('tmsg').textContent = r; } };
  $('topen').addEventListener('click', () => tryCall('TryOpen'));
  $('tapply').addEventListener('click', () => tryCall('TryApply'));
  $('tdiscard').addEventListener('click', () => tryCall('TryDiscard'));
  $('tclose').addEventListener('click', () => bound() && window.go.main.App.CloseTry());
  let hooked = false;
  function hook() {
    if (!hooked && window.runtime && window.runtime.EventsOn) { window.runtime.EventsOn('state', draw); hooked = true; }
    if (hooked && bound()) { window.go.main.App.State().then(draw); } else { setTimeout(hook, 300); }
  }
  hook();
</script>
</body>
</html>
